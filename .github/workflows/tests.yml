# 核心测试基线 CI（2026-10-24）
# 为什么要有：此前所有验证都依赖本地自觉 —— pre-commit 只跑 --quick 且 core.hooksPath
# 不随 clone 传播，换机器/换协作者 = 零门禁。这里把 tools/run_test.py --core
# （6 大基线，约 30s，3000+ 断言）挂到 push/PR，失败即红。
# 工具链前提：run_test.py 读 G/GODOT_BIN 环境变量（本文件注入下载的引擎路径）。

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Godot 引擎与导入产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-bin
            .godot
          key: godot-4.7.2-${{ runner.os }}-v1

      - name: 下载 Godot 4.7.2 headless
        run: |
          mkdir -p ~/.cache/godot-bin
          BIN=~/.cache/godot-bin/godot
          if [ ! -x "$BIN" ]; then
            curl -fsSL -o /tmp/godot.zip \
              https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -o /tmp/godot.zip -d /tmp/godot-extract
            mv /tmp/godot-extract/Godot_v4.7.2-stable_linux.x86_64 "$BIN"
            chmod +x "$BIN"
          fi
          "$BIN" --version

      - name: 导入项目资源（headless 一次性导入）
        run: ~/.cache/godot-bin/godot --headless --path . --import > /tmp/import.log 2>&1 || (tail -40 /tmp/import.log && exit 1)

      - name: 跑 6 大核心测试基线
        run: G=~/.cache/godot-bin/godot python3 tools/run_test.py --core
